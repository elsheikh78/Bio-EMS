<text x="40" y="799" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">PS1 = existing S-72-24 (24V, 3A). U1/U2 share common signal ground.</text>
<text x="40" y="829" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">AC inlet / fuse / switch / PE / protective covers: electrician design, outside this DC drawing.</text>
<text x="40" y="859" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">No 24V to MC1, Nano, GSM, SD, RTC or converter logic terminals. Never power modem from ESP 3V3.</text>
<text x="40" y="889" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">USB disconnected during external-5V operation until the exact board power path is verified.</text>
<text x="40" y="919" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Check regulator outputs unloaded first. Check GSM VCC 3.4–4.4V during 2A bursts at the module.</text>
<text x="40" y="949" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Branch fuses, cable sizes and connector ratings require actual lengths/loads. This is not AC approval.</text>
