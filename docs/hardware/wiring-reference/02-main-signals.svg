<text x="40" y="1039" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">LS1 is the symmetric 4-channel LV/HV MOSFET board; channels 3/4 unused. UART1 9600 8N1.</text>
<text x="40" y="1069" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Confirm HW519 RXD/TXD direction and voltage on the real boards before attaching MC1.</text>
<text x="40" y="1099" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">SD1 HW125 VCC=5V; verify MISO remains 3.3V logic. Keep SPI short; no MOSFET UART adapter on SPI.</text>
<text x="40" y="1129" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">W5500 POWER ON HOLD until exact breakout is identified. INT unused; confirm onboard hardware reset.</text>
<text x="40" y="1159" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">RTC pullups to 3.3V only. Add 4.7k each SDA/SCL only if absent. SQW and 32K unconnected.</text>
<text x="40" y="1189" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">A/B twisted pair. Confirm onboard termination before adding resistors. HW519 earth terminal unassigned.</text>
