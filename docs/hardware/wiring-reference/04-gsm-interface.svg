<text x="854" y="709" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#172a3a">Matching 50-ohm cable -&gt; EXTERNAL antenna</text>
<path d="M560 702 H840" stroke="#075f9b" stroke-width="3"/>
<text x="650" y="695" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#075f9b">RF</text>
<text x="40" y="751" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Q1=2N2222A. E/B/C names are electrical nodes, NOT a footprint. Verify exact maker pinout before fitting.</text>
<text x="40" y="781" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">TX divider ~2.80V nominal; Q1 receiver pulls ESP RX to 3.3V. UART2 9600 8N1, RX inversion ON.</text>
<text x="40" y="811" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">No UART wire to an unpowered modem. Wire with power OFF; commissioning logic only after rails stable.</text>
<text x="40" y="841" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">External GSM antenna only through verified RF path; do not also fit the spring antenna blindly.</text>
<text x="40" y="871" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">RST/DTR/RING/audio left unconnected for awake bench profile. Verify actual breakout power-on circuit.</text>
<text x="40" y="901" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Commands: gsmdiag; gsmtest +international-number. One REAL SMS; acceptance is not delivery.</text>
<text x="40" y="931" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">No automatic SMS alarms or GPRS fallback implemented. Do not treat this as a commissioned alarm system.</text>
</svg>