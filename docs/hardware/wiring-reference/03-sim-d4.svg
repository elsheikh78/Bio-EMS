<text x="40" y="991" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Four independent 3-wire probes. Verify actual cable mapping; colours alone do not establish pin function.</text>
<text x="40" y="1021" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Address 1: D7/D8 floating per Nano firmware; D6 unused. No external 5V to VIN.</text>
<text x="40" y="1051" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Disconnect Nano D0/D1 from RS2 during USB flashing; disconnect external 5V until power path verified.</text>
<text x="40" y="1081" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">Use screw terminal adapter and secured pullup carrier; loose wires pushed into bare PCB holes are invalid.</text>
<text x="40" y="1111" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#172a3a">HW519 automatic direction: no DE/RE control wire. Confirm direction and end termination physically.</text>
