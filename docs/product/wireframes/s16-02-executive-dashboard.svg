<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">BIO-EMS Clinical Command Center executive dashboard concept</title>
  <desc id="desc">A professional pharmaceutical environmental monitoring dashboard with deep teal navigation, operational summary cards, a temperature trend, area status, device health, and prioritized exceptions. All values are illustrative.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#17313a" flood-opacity="0.10"/>
    </filter>
    <style>
      .font { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .label { font-size: 12px; font-weight: 600; fill: #52666f; letter-spacing: .3px; }
      .small { font-size: 11px; fill: #667983; }
      .body { font-size: 13px; fill: #344a53; }
      .title { font-size: 28px; font-weight: 700; fill: #172b34; }
      .section { font-size: 15px; font-weight: 700; fill: #172b34; }
      .metric { font-size: 29px; font-weight: 750; fill: #172b34; }
      .nav { font-size: 13px; font-weight: 600; fill: #d8e7e9; }
    </style>
  </defs>

  <rect width="1440" height="1024" fill="#f3f7f8"/>

