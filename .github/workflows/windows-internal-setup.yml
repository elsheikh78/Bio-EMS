name: Internal Windows Setup

# HW-519 release QA: rebuild artifacts from the final documentation-cleanup commit.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-internal-setup.yml"
      - "backend/**"
      - "frontend/**"
      - "installer/windows/**"
      - "firmware/**"
      - "VERSION"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-internal-setup.yml"
      - "backend/**"
      - "frontend/**"
      - "installer/windows/**"
      - "firmware/**"
      - "VERSION"

permissions:
  contents: read

jobs:
  sim_firmware:
    name: Build SIM-D4 Nano bench firmware
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify HW-519 automatic-direction Nano contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "kDirection\|DE and /RE\|DE/RE tied" firmware/sim-d4-nano/SIM_D4 firmware/sim-d4-nano/README.md
          grep -q "HW-519" firmware/sim-d4-nano/SIM_D4/SIM_D4.ino
          grep -q "D6 | Not used for RS485" firmware/sim-d4-nano/README.md
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"
      - name: Build pinned Arduino AVR Nano target
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.6
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old \
            --output-dir sim-build firmware/sim-d4-nano/SIM_D4
          python3 firmware/sim-d4-nano/package_firmware.py \
            --hex sim-build/SIM_D4.ino.hex --output-dir sim-package
      - uses: actions/upload-artifact@v4
        with:
          name: BIO-EMS-SIM-D4-${{ github.sha }}-bench
          path: sim-package/**
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: Build governed ESP32-S3 Pilot firmware
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify HW-519 automatic-direction controller contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "SIM_RS485_DE_GPIO\|gpio_set_level(SIM_RS485_DE" firmware/site-controller-esp32s3/main
          grep -q "HW-519" firmware/site-controller-esp32s3/main/sim_modbus.c
          grep -q "GPIO16 is not used for RS485 direction control" firmware/site-controller-esp32s3/README.md

      - name: Build ESP32-S3 firmware with pinned ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware/site-controller-esp32s3

      - name: Package governed firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 firmware/site-controller-esp32s3/package_firmware.py \
            --build-dir firmware/site-controller-esp32s3/build \
            --output-dir bioems-firmware-package \
            --source-commit "$GITHUB_SHA" \
            --version-header firmware/site-controller-esp32s3/main/bioems_version.h

      - name: Verify packaged firmware manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("bioems-firmware-package")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["schemaVersion"] == 1
          assert manifest["target"] == "esp32s3"
          assert manifest["firmwareVersion"] == "0.1.0-pilot.4"
          assert manifest["protocolVersion"] == "1.3"
          assert manifest["bindingSchemaVersion"] == 1
          assert manifest["segments"]
          for segment in manifest["segments"]:
              path = root / segment["file"]
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == segment["sha256"]
          print("BIO-EMS firmware package verification: PASS")
          PY

      - name: Upload governed firmware package
        uses: actions/upload-artifact@v4
        with:
          name: BIO-EMS-ESP32S3-${{ github.sha }}-pilot
          path: bioems-firmware-package/**
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build signed BIO EGYPT pilot Setup
    needs: [firmware, sim_firmware]
    runs-on: windows-2022
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Download governed ESP32-S3 firmware package
        uses: actions/download-artifact@v4
        with:
          name: BIO-EMS-ESP32S3-${{ github.sha }}-pilot
          path: ${{ runner.temp }}\bioems-firmware-package

      - name: Download SIM-D4 Nano bench firmware package
        uses: actions/download-artifact@v4
        with:
          name: BIO-EMS-SIM-D4-${{ github.sha }}-bench
          path: ${{ runner.temp }}\bioems-sim-package

      - name: Install and verify pinned Inno Setup compiler
        shell: powershell
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $compilerRoot = Join-Path $env:RUNNER_TEMP "InnoSetup-6.7.3"
          $source = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          Invoke-WebRequest -Uri $source -OutFile $download
          $actualHash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup 6.7.3 installer checksum mismatch"
          }
          $process = Start-Process -FilePath $download -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=`"$compilerRoot`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup 6.7.3 installer exited with code $($process.ExitCode)"
          }
          $compiler = Join-Path $compilerRoot "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Pinned Inno Setup compiler was not installed"
          }
          $compilerEvidence = Join-Path $env:RUNNER_TEMP "inno-compiler-package-evidence.json"
          [ordered]@{
            version = "6.7.3"
            source = $source
            sha256 = $actualHash
          } | ConvertTo-Json | Set-Content -LiteralPath $compilerEvidence -Encoding UTF8
          "BIOEMS_INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BIOEMS_INNO_COMPILER_EVIDENCE=$compilerEvidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified Inno Setup 6.7.3 installer SHA-256 and isolated compiler path"

      - name: Parse Windows PowerShell installer scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem ".\installer\windows" -Filter "*.ps1" -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in @($parseErrors)) {
              Write-Error "$($_.Name): $($parseError.Message) at $($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber)"
              $failed = $true
            }
          }
          if ($failed) { throw "Windows PowerShell installer script parsing failed" }

      - name: Acquire and verify locked vendor inputs
        shell: powershell
        run: |
          $vendor = Join-Path $env:RUNNER_TEMP "bioems-vendor-cache"
          & .\installer\windows\Get-VendorInputs.ps1 -DestinationDirectory $vendor

      - name: Create deterministic application staging
        shell: powershell
        run: |
          $vendor = Join-Path $env:RUNNER_TEMP "bioems-vendor-cache"
          $stage = Join-Path $env:RUNNER_TEMP "bioems-staging"
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          & .\installer\windows\New-InstallerStaging.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -VendorCache $vendor `
            -FirmwarePackageDirectory (Join-Path $env:RUNNER_TEMP "bioems-firmware-package") `
            -SimFirmwarePackageDirectory (Join-Path $env:RUNNER_TEMP "bioems-sim-package") `
            -StagingDirectory $stage `
            -SourceCommit $env:GITHUB_SHA `
            -BuildTimestamp $timestamp

      - name: Compile single offline Setup executable
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bioems-staging"
          $evidence = Join-Path $env:RUNNER_TEMP "inno-commercial-use-evidence.txt"
          $compiler = $env:BIOEMS_INNO_COMPILER
          @"
          Inno Setup 6.7.3 commercial-use eligibility review evidence.
          Official source: https://jrsoftware.org/isinfo.php
          Build repository: $env:GITHUB_REPOSITORY
          Build commit: $env:GITHUB_SHA
          Build run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          This file contains no license key or secret.
          "@ | Set-Content -LiteralPath $evidence -Encoding UTF8
          & .\installer\windows\Build-Setup.ps1 `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -StagingDirectory $stage `
            -InnoCompiler $compiler `
            -CompilerPackageEvidence $env:BIOEMS_INNO_COMPILER_EVIDENCE `
            -CommercialLicenseEvidence $evidence

      - name: Sign and verify BIO EGYPT pilot Setup
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bioems-staging"
          $output = Join-Path $stage "output"
          $setup = Get-ChildItem -LiteralPath $output -Filter "BIO-EMS-Setup-*-x64.exe" -File
          if (@($setup).Count -ne 1) { throw "Expected exactly one Setup executable" }

          $subject = "CN=BIO-EMS Pilot Internal Code Signing"
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddYears(1)
          $certificatePath = Join-Path $output "BIO-EMS-Pilot-Code-Signing.cer"
          Export-Certificate -Cert $certificate -FilePath $certificatePath -Type CERT | Out-Null

          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw "Windows SDK SignTool was not found"
          }
          & $signTool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /s My $setup.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Pilot Setup Authenticode signing failed"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($signature.Status -eq "NotSigned" -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
            throw "Pilot Setup embedded signer verification failed"
          }
          $certificate.Thumbprint | Set-Content -LiteralPath (Join-Path $output "CERTIFICATE-THUMBPRINT.txt") -Encoding ASCII
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -LiteralPath (Join-Path $output "SHA256SUMS.txt") -Encoding ASCII
          Copy-Item -LiteralPath ".\installer\windows\INTERNAL-SETUP-TESTING.md" -Destination (Join-Path $output "INTERNAL-SETUP-TESTING.md")
          Copy-Item -LiteralPath ".\installer\windows\Install-PilotSigningCertificate.ps1" -Destination (Join-Path $output "Install-PilotSigningCertificate.ps1")
          & (Join-Path $output "Install-PilotSigningCertificate.ps1") -CertificatePath $certificatePath -ThumbprintPath (Join-Path $output "CERTIFICATE-THUMBPRINT.txt")
          Copy-Item -LiteralPath ".\installer\windows\Install-BIOEMS-Pilot.cmd" -Destination (Join-Path $output "Install-BIOEMS-Pilot.cmd")

      - name: Install Setup and verify pilot health on Windows
        timeout-minutes: 15
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bioems-staging"
          $output = Join-Path $stage "output"
          $setup = Get-ChildItem -LiteralPath $output -Filter "BIO-EMS-Setup-*-x64.exe" -File
          if (@($setup).Count -ne 1) { throw "Expected exactly one Setup executable" }
          $setupLog = Join-Path $env:RUNNER_TEMP "bioems-clean-install.log"
          $env:BIOEMS_CI_INSTALL_MODE = "new"
          $env:BIOEMS_CI_ADMIN_USERNAME = "ci-admin"
          $env:BIOEMS_CI_ADMIN_PASSWORD = "CiAdminPilot2026"
          $env:BIOEMS_CI_ADMIN_EMAIL = "ci-admin@example.invalid"
          $env:BIOEMS_CI_CUSTOMER_NAME = "BIO-EMS CI Customer"
          $env:BIOEMS_CI_CUSTOMER_CODE = "CI-CUSTOMER"
          $env:BIOEMS_CI_SITE_NAME = "BIO-EMS CI Site"
          $env:BIOEMS_CI_SITE_CODE = "CI-SITE"
          $env:BIOEMS_CI_SITE_LOCATION = "CI"
          $process = Start-Process -FilePath $setup.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/LOG=`"$setupLog`""
          ) -PassThru
          if (-not $process.WaitForExit(600000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Write-Host "=== SETUP LOG AFTER TIMEOUT ==="
            Get-Content -LiteralPath $setupLog -Tail 300 -ErrorAction SilentlyContinue
            Write-Host "=== BIO-EMS RUNTIME LOGS AFTER TIMEOUT ==="
            Get-ChildItem "C:\ProgramData\BIO-EMS\logs" -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            throw "BIO-EMS Setup exceeded the 10-minute installation timeout"
          }
          $process.Refresh()
          $missingServices = @(
            "BIOEMS-MQTT",
            "BIOEMS-InfluxDB",
            "BIOEMS-Provisioner",
            "BIOEMS-Backend"
          ) | Where-Object { -not (Get-Service -Name $_ -ErrorAction SilentlyContinue) }
          if ($process.ExitCode -ne 0 -or @($missingServices).Count -gt 0) {
            Write-Host "=== SETUP LOG ==="
            Get-Content -LiteralPath $setupLog -Tail 300 -ErrorAction SilentlyContinue
            Write-Host "=== BIO-EMS RUNTIME LOGS ==="
            Get-ChildItem "C:\ProgramData\BIO-EMS\logs" -File -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            throw "BIO-EMS installation failed: exitCode=$($process.ExitCode) missingServices=$($missingServices -join ',')"
          }
          $setupLogText = Get-Content -LiteralPath $setupLog -Raw
          if ($setupLogText -notmatch '(?s)Install-DEP0103Services\.ps1.*?Process exit code: 0') {
            throw "BIO-EMS service installation did not report exit code 0"
          }
          if ($setupLogText -notmatch '(?s)Test-PostInstallHealth\.ps1.*?Process exit code: 0') {
            throw "BIO-EMS elevated post-install health did not report exit code 0"
          }
          if ($setupLogText -notmatch '(?s)Initialize-PilotAdmin\.ps1.*?Process exit code: 0') {
            throw "BIO-EMS elevated customer administrator bootstrap did not report exit code 0"
          }
          $stoppedServices = @(Get-Service BIOEMS-MQTT,BIOEMS-InfluxDB,BIOEMS-Provisioner,BIOEMS-Backend |
            Where-Object Status -ne "Running")
          if ($stoppedServices.Count -gt 0) {
            Write-Host "=== SETUP LOG AFTER SERVICE STOP ==="
            Get-Content -LiteralPath $setupLog -Tail 300 -ErrorAction SilentlyContinue
            Write-Host "=== BIO-EMS RUNTIME LOGS AFTER SERVICE STOP ==="
            Get-ChildItem "C:\ProgramData\BIO-EMS\logs" -File -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            throw "BIO-EMS service is not running: $($stoppedServices.Name -join ',')"
          }
          $backendHealth = $null
          $backendHealthError = $null
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $backendHealth = Invoke-RestMethod -Uri "https://localhost/api/v1/health" -TimeoutSec 15
              if ($backendHealth.status -eq "UP") { break }
              $backendHealthError = "Health status was '$($backendHealth.status)'"
            } catch {
              $backendHealthError = $_.Exception.Message
            }
            Write-Host "Waiting for BIO-EMS HTTPS backend health ($attempt/30): $backendHealthError"
            Start-Sleep -Seconds 5
          }
          if (-not $backendHealth -or $backendHealth.status -ne "UP") {
            Write-Host "=== BIO-EMS BACKEND SERVICE STATUS AFTER HEALTH TIMEOUT ==="
            Get-Service "BIOEMS-Backend" -ErrorAction SilentlyContinue | Format-List *
            & sc.exe queryex "BIOEMS-Backend"
            Write-Host "=== BIO-EMS RUNTIME LOGS AFTER HEALTH TIMEOUT ==="
            Get-ChildItem "C:\ProgramData\BIO-EMS\logs" -File -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content -LiteralPath $_.FullName -Tail 120 -ErrorAction SilentlyContinue
              }
            throw "BIO-EMS HTTPS backend health did not become UP: $backendHealthError"
          }
          $loginBody = @{
            username = $env:BIOEMS_CI_ADMIN_USERNAME
            password = $env:BIOEMS_CI_ADMIN_PASSWORD
          } | ConvertTo-Json
          $login = Invoke-RestMethod -Uri "https://localhost/api/v1/auth/login" -Method Post -ContentType "application/json" -Body $loginBody -TimeoutSec 15
          if (-not $login.access_token -or $login.user.role -ne "ADMIN") {
            throw "BIO-EMS installed customer administrator login verification failed"
          }
          $headers = @{ Authorization = "Bearer $($login.access_token)" }
          $users = Invoke-RestMethod -Uri "https://localhost/api/v1/users" -Headers $headers -TimeoutSec 15
          if (@($users).Count -ne 1 -or $users[0].username -ne $env:BIOEMS_CI_ADMIN_USERNAME) {
            throw "BIO-EMS installed user-management API verification failed"
          }
          $ownerPreflight = & "C:\Program Files\BIO-EMS\installer\Invoke-SystemOwnerProvisioning.ps1" -ValidateOnly
          if ($ownerPreflight -notcontains "BIO-EMS System Owner Provisioning preflight: PASS") {
            throw "Installed System Owner Provisioning preflight failed: $($ownerPreflight -join '; ')"
          }
          Remove-Item Env:BIOEMS_CI_ADMIN_USERNAME -ErrorAction SilentlyContinue
          Remove-Item Env:BIOEMS_CI_ADMIN_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:BIOEMS_CI_ADMIN_EMAIL -ErrorAction SilentlyContinue

      - name: Exercise installed InfluxDB backup and historical telemetry restore
        timeout-minutes: 10
        shell: powershell
        run: |
          & ".\installer\windows\Test-DEPBRInfluxRoundTrip.ps1" -ApplicationRoot "C:\Program Files\BIO-EMS" -PersistentRoot "C:\ProgramData\BIO-EMS"

      - name: Exercise client update upload and independent worker
        timeout-minutes: 20
        shell: powershell
        run: |
          $output = Join-Path $env:RUNNER_TEMP "bioems-staging\output"
          $setup = @(Get-ChildItem -LiteralPath $output -Filter "BIO-EMS-Setup-*-x64.exe" -File)
          if ($setup.Count -ne 1) { throw "Expected one client Setup" }
          & ".\installer\windows\Test-ClientUpdateRoundTrip.ps1" -SetupPath $setup[0].FullName

      - name: Exercise controlled New Install over existing installation
        timeout-minutes: 15
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bioems-staging"
          $output = Join-Path $stage "output"
          $setup = @(Get-ChildItem -LiteralPath $output -Filter "BIO-EMS-Setup-*-x64.exe" -File)
          if ($setup.Count -ne 1) { throw "Expected exactly one Setup executable for New Install replacement test" }

          $env:BIOEMS_CI_INSTALL_MODE = "new"
          $env:BIOEMS_CI_CONFIRM_NEW_INSTALL_CLEANUP = "YES"
          $env:BIOEMS_CI_ADMIN_USERNAME = "ci-admin-reinstall"
          $env:BIOEMS_CI_ADMIN_PASSWORD = "CiAdminPilot2026"
          $env:BIOEMS_CI_ADMIN_EMAIL = "ci-admin-reinstall@example.invalid"
          $env:BIOEMS_CI_CUSTOMER_NAME = "BIO-EMS CI Replacement Customer"
          $env:BIOEMS_CI_CUSTOMER_CODE = "CI-REPLACEMENT"
          $env:BIOEMS_CI_SITE_NAME = "BIO-EMS CI Replacement Site"
          $env:BIOEMS_CI_SITE_CODE = "CI-REPLACEMENT-SITE"
          $env:BIOEMS_CI_SITE_LOCATION = "CI"

          # Emulate a legacy September Pilot install whose ProgramData children
          # carry protected service-owned ACLs. The replacement Setup must reclaim
          # only the BIO-EMS tree before reading TLS evidence and deleting it.
          $legacyTlsEvidence = "C:\ProgramData\BIO-EMS\config\tls-certificate.json"
          if (Test-Path -LiteralPath $legacyTlsEvidence -PathType Leaf) {
            & icacls.exe $legacyTlsEvidence /inheritance:r /grant:r "*S-1-5-18:F" /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not stage protected legacy TLS evidence ACL" }
          }
          $legacyDataRoot = "C:\ProgramData\BIO-EMS\data"
          if (Test-Path -LiteralPath $legacyDataRoot -PathType Container) {
            & icacls.exe $legacyDataRoot /inheritance:r /grant:r "*S-1-5-18:(OI)(CI)F" /T /C /Q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not stage protected legacy data ACL" }
          }

          $cleanupLog = Join-Path $env:WINDIR "Temp\BIO-EMS-NewInstallCleanup.log"
          Remove-Item -LiteralPath $cleanupLog -Force -ErrorAction SilentlyContinue
          $setupLog = Join-Path $env:RUNNER_TEMP "bioems-new-install-over-existing.log"
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/LOG=`"$setupLog`""
          ) -PassThru
          if (-not $process.WaitForExit(600000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $setupLog -Tail 300 -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $cleanupLog -Raw -ErrorAction SilentlyContinue
            throw "Controlled New Install replacement exceeded the 10-minute timeout"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            Write-Host "=== NEW INSTALL REPLACEMENT SETUP LOG ==="
            Get-Content -LiteralPath $setupLog -Tail 300 -ErrorAction SilentlyContinue
            Write-Host "=== NEW INSTALL CLEANUP DIAGNOSTIC ==="
            Get-Content -LiteralPath $cleanupLog -Raw -ErrorAction SilentlyContinue
            throw "Controlled New Install replacement failed with exit code $($process.ExitCode)"
          }
          if (Test-Path -LiteralPath $cleanupLog -PathType Leaf) {
            $detail = Get-Content -LiteralPath $cleanupLog -Raw
            throw "Controlled New Install left a cleanup failure diagnostic after Setup success: $detail"
          }

          $requiredServices = @("BIOEMS-MQTT", "BIOEMS-InfluxDB", "BIOEMS-Provisioner", "BIOEMS-Backend", "BIOEMS-RestoreWorker")
          $stopped = @($requiredServices | ForEach-Object { Get-Service -Name $_ -ErrorAction Stop } | Where-Object Status -ne "Running")
          if ($stopped.Count -gt 0) {
            throw "Controlled New Install replacement left stopped services: $($stopped.Name -join ',')"
          }

          $health = $null
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri "https://localhost/api/v1/health" -TimeoutSec 15
              if ($health.status -eq "UP") { break }
            } catch {}
            Start-Sleep -Seconds 5
          }
          if (-not $health -or $health.status -ne "UP") {
            throw "BIO-EMS HTTPS health did not recover after controlled New Install replacement"
          }

          $loginBody = @{
            username = $env:BIOEMS_CI_ADMIN_USERNAME
            password = $env:BIOEMS_CI_ADMIN_PASSWORD
          } | ConvertTo-Json
          $login = Invoke-RestMethod -Uri "https://localhost/api/v1/auth/login" -Method Post -ContentType "application/json" -Body $loginBody -TimeoutSec 15
          if (-not $login.access_token -or $login.user.username -ne $env:BIOEMS_CI_ADMIN_USERNAME) {
            throw "Replacement administrator login verification failed after controlled New Install"
          }
          Write-Host "BIO-EMS controlled New Install over existing installation: PASS"

