name: Format SEC-OWNER branch

on:
  push:
    branches:
      - feat/sec-owner-01

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prettier --write src/modules/platform-auth/owner-commissioning.spec.ts src/scripts/issue-owner-commissioning-package.ts
      - name: Commit canonical formatting
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/platform-auth/owner-commissioning.spec.ts backend/src/scripts/issue-owner-commissioning-package.ts
          git commit -m "style(security): apply canonical Prettier formatting"
          git push
