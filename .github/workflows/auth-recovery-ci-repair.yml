name: Auth Recovery CI Repair

on:
  push:
    branches:
      - feat/auth-password-recovery

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/auth-password-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply evidence-based final CI repairs
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          root = Path('.')

          # Restore the complete integration spec from the last known-good tree before
          # applying the single evidence-backed audit assertion change.
          restored = subprocess.check_output([
              'git', 'show',
              '01a08408683553681f24f0e5947cc64b75c81604:backend/src/app.user-management.spec.ts'
          ], text=True)
          p = root / 'backend/src/app.user-management.spec.ts'
          restored = restored.replace(
              '      new_values_json: null,\n',
              '      new_values_json: JSON.stringify({ password_change_required: "[REDACTED]" }),\n',
              1,
          )
          p.write_text(restored)

          # updateStatus is synchronous. Capture the mapped AppError synchronously so
          # the test verifies the real LAST_ACTIVE_ADMIN_REQUIRED mapping.
          p = root / 'backend/src/services/tests/user.service.spec.ts'
          s = p.read_text()
          old = '''    await expect(\n      service.updateStatus(actor, 2, { status: "disabled" }, requestContext)\n    ).rejects.toMatchObject({ code: "LAST_ACTIVE_ADMIN_REQUIRED" });'''
          new = '''    let caught: unknown;\n    try {\n      service.updateStatus(actor, 2, { status: "disabled" }, requestContext);\n    } catch (error) {\n      caught = error;\n    }\n    expect(caught).toMatchObject({ code: "LAST_ACTIVE_ADMIN_REQUIRED" });'''
          if old not in s:
              raise SystemExit('Expected synchronous status assertion not found')
          p.write_text(s.replace(old, new, 1))

      - name: Format repaired files
        run: |
          cd backend
          npx prettier --write src/app.user-management.spec.ts src/services/tests/user.service.spec.ts
      - name: Validate backend
        run: |
          cd backend
          npm ci
          npm run typecheck
          npm run build
          npm run lint
          npm run format:check
          npm test -- --run
      - name: Validate frontend
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:run
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/app.user-management.spec.ts backend/src/services/tests/user.service.spec.ts frontend/src/pages/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
          else
            git commit -m "test(auth): close final recovery CI assertions"
            git push origin HEAD:feat/auth-password-recovery
          fi
