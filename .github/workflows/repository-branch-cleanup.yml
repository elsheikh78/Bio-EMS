          declare -a targets=()

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"
            [[ "$branch" == "HEAD" || "$branch" == "main" ]] && continue

            if [[ -z "${expected[$branch]+x}" ]]; then
              echo "::error::Unexpected branch not present in cleanup audit: $branch"
              exit 1
            fi

            actual_sha="$(git rev-parse "refs/remotes/origin/$branch")"
            if [[ "$actual_sha" != "${expected[$branch]}" ]]; then
              echo "::error::Refusing to delete changed branch $branch: expected ${expected[$branch]}, found $actual_sha"
              exit 1
            fi

            targets+=("$branch")
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          mapfile -t targets < <(printf '%s\n' "${targets[@]}" | sort)
          echo "SHA-verified branches scheduled for deletion: ${#targets[@]}"

          for ((i=0; i<${#targets[@]}; i+=40)); do
            batch=("${targets[@]:i:40}")
            git push origin --delete "${batch[@]}"
          done

          git fetch origin --prune

          remaining="$(
            git for-each-ref --format='%(refname:short)' refs/remotes/origin |
              sed 's#^origin/##' |
              grep -Ev '^(HEAD|main)$' || true
          )"

          if [[ -n "$remaining" ]]; then
            echo "::error::Unexpected remote branches remain after cleanup:"
            echo "$remaining"
            exit 1
          fi

          echo "Repository branch cleanup complete: only main remains."
