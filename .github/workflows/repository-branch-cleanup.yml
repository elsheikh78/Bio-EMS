name: One-time repository branch cleanup

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == '[repo-cleanup] execute audited branch deletion'
    name: Delete audited historical branches
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete only SHA-pinned audited branches
