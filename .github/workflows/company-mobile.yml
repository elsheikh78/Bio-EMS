name: Company mobile Android and iOS
on:
  pull_request:
    branches: [main]
    paths: ["company-mobile/**", ".github/workflows/company-mobile.yml"]
  push:
    branches: [main]
    paths: ["company-mobile/**", ".github/workflows/company-mobile.yml"]
  workflow_dispatch:
concurrency:
  group: company-mobile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: company-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: company-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo install --check
        env:
          EXPO_OFFLINE: "1"
      - run: npx expo prebuild --no-install --platform all
        env:
          CI: "1"
      - run: npm run export
        env:
          CI: "1"
          EXPO_OFFLINE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: BIOEMS-Company-Android-iOS-JS-bundles-not-installers
          path: company-mobile/dist
          retention-days: 14

  android-qa:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: company-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: company-mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Generate isolated QA Android project
        run: npx expo prebuild --no-install --platform android
        env:
          CI: "1"
          BIOEMS_MOBILE_QA: "1"
      - name: Build bundled arm64 QA APK (development certificate, not a store release)
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2 --no-daemon
        working-directory: company-mobile/android
        env:
          CI: "1"
          BIOEMS_MOBILE_QA: "1"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
      - name: Verify QA package and signature
        run: |
          mkdir -p qa-output
          cp android/app/build/outputs/apk/release/app-release.apk qa-output/BIOEMS-Company-Pilot-Android-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose qa-output/BIOEMS-Company-Pilot-Android-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging qa-output/BIOEMS-Company-Pilot-Android-arm64.apk | head -1 | grep "com.bioemsegypt.company.pilot"
          cd qa-output
          sha256sum BIOEMS-Company-Pilot-Android-arm64.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BIOEMS-Company-Pilot-Android-arm64-QA
          path: company-mobile/qa-output/
          retention-days: 14
