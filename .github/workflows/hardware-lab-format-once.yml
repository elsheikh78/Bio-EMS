name: Hardware Lab Format Once

on:
  push:
    branches:
      - feature/hardware-lab-qualification

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/hardware-lab-qualification
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Format backend changes
        working-directory: backend
        run: |
          npm ci
          npx prettier --write             database/sqlite/migration-runner.ts             database/sqlite/migrations/031_create_hardware_qualification_lab.ts             src/app.ts             src/config/platform-jwt.config.spec.ts             src/config/platform-jwt.config.ts             src/controllers/hardware-lab.controller.ts             src/modules/hardware-lab/hardware-lab.profile.ts             src/modules/hardware-lab/hardware-lab.schema.ts             src/modules/hardware-lab/hardware-lab.service.spec.ts             src/modules/hardware-lab/hardware-lab.service.ts             src/routes/platform-hardware-lab.route.ts             src/services/platform-session.service.spec.ts             src/services/platform-session.service.ts

      - name: Format frontend changes
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write             src/App.tsx             src/hardware-lab/contracts.ts             src/pages/SystemOwnerConsolePage.tsx             src/pages/SystemOwnerHardwareLabPage.spec.tsx             src/pages/SystemOwnerHardwareLabPage.tsx             src/platform-auth/PlatformAuthenticationProvider.idle.spec.ts             src/platform-auth/PlatformAuthenticationProvider.tsx

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git commit -m "style: apply project prettier formatting"
          git push origin HEAD:feature/hardware-lab-qualification
