name: Temporary MFA UI formatter

on:
  push:
    branches:
      - feat/sec-owner-01

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sec-owner-01
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx prettier --write src/platform-auth/contracts.ts src/pages/SystemOwnerLoginPage.tsx
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "style(frontend): apply exact MFA login formatting"
          git push origin HEAD:feat/sec-owner-01
