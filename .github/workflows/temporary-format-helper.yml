name: Temporary format helper

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format installer qualification spec
        working-directory: backend
        run: npx prettier --write src/deployment/windows-installer-package.spec.ts
      - name: Upload formatted spec
        uses: actions/upload-artifact@v4
        with:
          name: formatted-installer-spec
          path: backend/src/deployment/windows-installer-package.spec.ts
          retention-days: 1
