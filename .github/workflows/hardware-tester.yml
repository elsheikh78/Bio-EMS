name: Standalone Hardware QC Tester
on:
  pull_request:
    paths: ['tools/hardware-tester/**', '.github/workflows/hardware-tester.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: tools/hardware-tester
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Logic, persistence, PDF and GUI smoke
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python smoke.py sample-output --gui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: arduino/setup-arduino-cli@v2
      - name: Compile isolated sensor firmware for ESP32-S3 and Nano
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          arduino-cli core install arduino:avr@1.8.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          arduino-cli lib install "OneWire@2.3.8" "DallasTemperature@4.0.5"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir firmware/build/esp32 firmware/QC_Sensors
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          arduino-cli compile --fqbn arduino:avr:nano:cpu=atmega328old --output-dir firmware/build/nano firmware/QC_Sensors
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows EXE
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name BIO-EMS-Hardware-Tester app.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify bundled EXE can generate PDF without Python
        run: |
          $process = Start-Process -FilePath dist/BIO-EMS-Hardware-Tester.exe -ArgumentList '--self-test', 'exe-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'EXE self-test failed' }
          if (!(Test-Path exe-smoke/DEMO_QC_Report.pdf)) { throw 'Bundled report missing' }
      - name: Package standalone deliverable
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/BIO-EMS-Hardware-Tester.exe, README.md, OPERATOR_GUIDE_AR.txt package/
          Copy-Item firmware package/firmware -Recurse
          Copy-Item sample-output/DEMO_QC_Report.pdf package/
          git rev-parse HEAD | Set-Content package/SOURCE_COMMIT.txt
          Get-ChildItem package -Recurse -File | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.FullName.Substring((Resolve-Path package).Path.Length+1) } | Set-Content package/SHA256SUMS.txt
          Compress-Archive package/* BIO-EMS-Hardware-Tester-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BIO-EMS-Hardware-Tester-Windows
          path: tools/hardware-tester/BIO-EMS-Hardware-Tester-Windows.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hardware-Tester-QA
          path: |
            tools/hardware-tester/gui-smoke.png
            tools/hardware-tester/sample-output/DEMO_QC_Report.pdf
