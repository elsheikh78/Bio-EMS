name: P3 Prettier Fix

on:
  push:
    branches:
      - agent/p3-02-commissioning-persistence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/p3-02-commissioning-persistence
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format commissioning files
        working-directory: backend
        run: npx prettier --write "src/modules/commissioning/**/*.ts"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/commissioning
          git diff --cached --quiet || git commit -m "style(p3): format commissioning domain and repository"
          git push origin HEAD:agent/p3-02-commissioning-persistence
