name: Windows Manufacturer Tools

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-manufacturer-tools.yml"
      - "backend/**"
      - "installer/windows/Invoke-ManufacturerOwnerSigner.ps1"
      - "installer/windows/New-ManufacturerToolsStaging.ps1"
      - "installer/windows/ManufacturerTools.iss"
      - "VERSION"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-manufacturer-tools.yml"
      - "backend/**"
      - "installer/windows/Invoke-ManufacturerOwnerSigner.ps1"
      - "installer/windows/New-ManufacturerToolsStaging.ps1"
      - "installer/windows/ManufacturerTools.iss"
      - "VERSION"

permissions:
  contents: read

jobs:
  build:
    name: Build standalone Manufacturer Tools Setup
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $download = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          $root = Join-Path $env:RUNNER_TEMP "InnoSetup-6.7.3"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $download
          $hash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup checksum mismatch" }
          $process = Start-Process -FilePath $download -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/DIR=`"$root`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed" }
          "BIOEMS_INNO_COMPILER=$(Join-Path $root 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Parse PowerShell tools
        shell: powershell
        run: |
          $failed = $false
          @(".\installer\windows\Invoke-ManufacturerOwnerSigner.ps1",".\installer\windows\New-ManufacturerToolsStaging.ps1") | ForEach-Object {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($_,[ref]$tokens,[ref]$errors) | Out-Null
            if (@($errors).Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; $failed = $true }
          }
          if ($failed) { throw "Manufacturer PowerShell parsing failed" }

      - name: Acquire locked runtime
        shell: powershell
        run: |
          $vendor = Join-Path $env:RUNNER_TEMP "bioems-vendor-cache"
          New-Item -ItemType Directory -Path $vendor -Force | Out-Null
          $archive = Join-Path $vendor "node-v22.22.0-win-x64.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/download/release/v22.22.0/node-v22.22.0-win-x64.zip" -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "c97fa376d2becdc8863fcd3ca2dd9a83a9f3468ee7ccf7a6d076ec66a645c77a") {
            throw "Pinned Node.js runtime checksum mismatch"
          }

      - name: Stage Manufacturer Tools
        shell: powershell
        run: |
          $vendor = Join-Path $env:RUNNER_TEMP "bioems-vendor-cache"
          $stage = Join-Path $env:RUNNER_TEMP "bioems-manufacturer-tools"
          & .\installer\windows\New-ManufacturerToolsStaging.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -VendorCache $vendor -StagingDirectory $stage

      - name: Compile Manufacturer Tools Setup
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bioems-manufacturer-tools"
          $version = (Get-Content .\VERSION -Raw).Trim()
          & $env:BIOEMS_INNO_COMPILER "/Qp" "/DStageRoot=$stage" "/DProductVersion=$version" ".\installer\windows\ManufacturerTools.iss"
          if ($LASTEXITCODE -ne 0) { throw "Manufacturer Tools compilation failed" }

      - name: Sign and verify Setup
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bioems-manufacturer-tools"
          $output = Join-Path $stage "output"
          $setup = Get-ChildItem -LiteralPath $output -Filter "BIO-EMS-Manufacturer-Tools-Setup-*-x64.exe" -File
          if (@($setup).Count -ne 1) { throw "Expected one Manufacturer Tools Setup" }
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=BIO-EMS Manufacturer Tools Pilot Code Signing" -CertStoreLocation "Cert:\CurrentUser\My" -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddYears(1)
          $certificatePath = Join-Path $output "BIO-EMS-Manufacturer-Tools-Pilot-Code-Signing.cer"
          Export-Certificate -Cert $certificate -FilePath $certificatePath -Type CERT | Out-Null
          $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter "signtool.exe" -File -Recurse | Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) { throw "SignTool was not found" }
          & $signTool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /s My $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "Manufacturer Tools signing failed" }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($signature.Status -eq "NotSigned" -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) { throw "Embedded signature verification failed" }
          $certificate.Thumbprint | Set-Content -LiteralPath (Join-Path $output "CERTIFICATE-THUMBPRINT.txt") -Encoding ASCII
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -LiteralPath (Join-Path $output "SHA256SUMS.txt") -Encoding ASCII

      - name: Install and verify offline runtime
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "bioems-manufacturer-tools"
          $setup = Get-ChildItem -LiteralPath (Join-Path $stage "output") -Filter "BIO-EMS-Manufacturer-Tools-Setup-*-x64.exe" -File
          $process = Start-Process -FilePath $setup.FullName -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Manufacturer Tools installation failed" }
          $root = Join-Path $env:ProgramFiles "BIO-EMS Manufacturer Tools"
          @((Join-Path $root "Invoke-ManufacturerOwnerSigner.ps1"),(Join-Path $root "backend\dist\src\scripts\issue-owner-commissioning-package.js")) | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Installed file is missing: $_" }
          }
          $node = Get-ChildItem -LiteralPath (Join-Path $root "runtime") -Filter "node.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $node) { throw "Installed private Node.js runtime is missing" }
          $secretFiles = Get-ChildItem -LiteralPath $root -File -Recurse | Where-Object { $_.Extension -match '^\.(pem|key|pfx|p12)$' }
          if (@($secretFiles).Count -gt 0) { throw "Package contains prohibited key-container files" }
          $privateKeyMarker = Get-ChildItem -LiteralPath $root -File -Recurse | Select-String -SimpleMatch "-----BEGIN PRIVATE KEY-----" -List
          if (@($privateKeyMarker).Count -gt 0) { throw "Package contains prohibited private-key material" }

      - name: Upload Manufacturer Tools Setup
        uses: actions/upload-artifact@v4
        with:
          name: BIO-EMS-Manufacturer-Tools-${{ github.sha }}-pilot-signed
          path: |
            ${{ runner.temp }}\bioems-manufacturer-tools\output\BIO-EMS-Manufacturer-Tools-Setup-*-x64.exe
            ${{ runner.temp }}\bioems-manufacturer-tools\output\SHA256SUMS.txt
            ${{ runner.temp }}\bioems-manufacturer-tools\output\CERTIFICATE-THUMBPRINT.txt
            ${{ runner.temp }}\bioems-manufacturer-tools\output\BIO-EMS-Manufacturer-Tools-Pilot-Code-Signing.cer
          if-no-files-found: error
          retention-days: 14
