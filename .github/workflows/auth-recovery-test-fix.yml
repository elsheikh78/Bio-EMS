name: Auth recovery exact formatter

on:
  push:
    branches:
      - feat/auth-password-recovery

permissions:
  contents: write

jobs:
  format-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/auth-password-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Apply project Prettier to recovery rate limiter
        working-directory: backend
        run: npx prettier --write src/middleware/password-recovery-rate-limit.middleware.ts
      - name: Validate backend
        working-directory: backend
        run: |
          npm run typecheck
          npm run build
          npm run lint
          npm run format:check
          npm test -- --run
      - name: Commit exact formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/middleware/password-recovery-rate-limit.middleware.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(auth): apply project prettier to recovery rate limiter"
          git push origin HEAD:feat/auth-password-recovery
