name: Temporary Prettier Apply

on:
  push:
    branches:
      - fix/installation-receipt-customer-site

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format backend
        working-directory: backend
        run: npm run format
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- backend/src; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src
          git commit -m "style: format receipt repair changes"
          git push origin HEAD:fix/installation-receipt-customer-site
