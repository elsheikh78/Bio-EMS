name: Temporary Prettier Diff

on:
  push:
    branches:
      - fix/installation-receipt-customer-site

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Format backend
        working-directory: backend
        run: npm run format
      - name: Show formatter diff
        run: git diff -- backend/src
