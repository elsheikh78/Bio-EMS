name: DEP-BR Prettier Fix

on:
  push:
    branches: [feat/dep-br-backup-restore]
    paths: [.github/workflows/dep-br-prettier-fix.yml, backend/src/deployment/windows-installer-package.spec.ts, backend/src/modules/platform-backup/**, backend/src/routes/platform-backup.route.ts, backend/src/controllers/platform-backup.controller.ts, backend/src/authorization/**, backend/src/app.ts]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/dep-br-backup-restore
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Format exact CI-reported files
        working-directory: backend
        run: npm exec prettier -- --write src/deployment/windows-installer-package.spec.ts src/modules/licensing/installer-integration.ts src/scripts/provision-installation-identity.ts src/modules/platform-backup/**/*.ts src/routes/platform-backup.route.ts src/controllers/platform-backup.controller.ts src/authorization/*.ts src/app.ts
      - name: Commit formatter output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/deployment/windows-installer-package.spec.ts backend/src/modules/licensing/installer-integration.ts backend/src/scripts/provision-installation-identity.ts backend/src/modules/platform-backup backend/src/routes/platform-backup.route.ts backend/src/controllers/platform-backup.controller.ts backend/src/authorization backend/src/app.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: apply backend prettier to DEP-BR files"
          git push origin HEAD:feat/dep-br-backup-restore
