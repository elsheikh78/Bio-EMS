name: Temporary format preview

on:
  push:
    branches:
      - feat/installation-builder-provisioning-flow

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Format backend changed files
        working-directory: backend
        run: |
          npm ci
          npx prettier --write             src/modules/installation/installation-context.service.ts             src/modules/installation/installation-context.service.spec.ts             src/controllers/installation.controller.ts             src/routes/platform-operations.route.ts
          for f in             src/modules/installation/installation-context.service.ts             src/modules/installation/installation-context.service.spec.ts             src/controllers/installation.controller.ts             src/routes/platform-operations.route.ts
          do
            echo "===== BEGIN backend/$f ====="
            cat "$f"
            echo "===== END backend/$f ====="
          done
      - name: Format frontend changed files
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write             src/installations/contracts.ts             src/installations/queries.ts             src/installations/InstallationBuilder.model.ts             src/installations/InstallationBuilder.tsx             src/installations/InstallationBuilder.spec.ts             src/pages/SystemOwnerInstallationsPage.tsx             src/pages/P8Localization.spec.tsx
          for f in             src/installations/contracts.ts             src/installations/queries.ts             src/installations/InstallationBuilder.model.ts             src/installations/InstallationBuilder.tsx             src/installations/InstallationBuilder.spec.ts             src/pages/SystemOwnerInstallationsPage.tsx             src/pages/P8Localization.spec.tsx
          do
            echo "===== BEGIN frontend/$f ====="
            cat "$f"
            echo "===== END frontend/$f ====="
          done
