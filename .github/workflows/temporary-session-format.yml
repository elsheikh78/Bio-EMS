name: Temporary session formatter

on:
  push:
    branches:
      - feat/sec-owner-01

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sec-owner-01
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npx prettier --write src/services/platform-session.service.ts src/services/platform-session.service.spec.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/platform-session.service.ts backend/src/services/platform-session.service.spec.ts
          git commit -m "style(security): apply exact session formatting"
          git push origin HEAD:feat/sec-owner-01
