name: Temporary final format preview

on:
  push:
    branches:
      - feat/installation-builder-provisioning-flow

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Format backend latest files
        working-directory: backend
        run: |
          npm ci
          npx prettier --write src/modules/installation/installation.service.ts src/modules/installation/installation.service.spec.ts
          for f in src/modules/installation/installation.service.ts src/modules/installation/installation.service.spec.ts; do
            echo "===== BEGIN backend/$f ====="
            cat "$f"
            echo "===== END backend/$f ====="
          done
      - name: Format frontend latest files
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/installations/InstallationBuilder.model.ts src/installations/InstallationBuilder.tsx src/installations/InstallationBuilder.spec.ts src/pages/SystemOwnerInstallationsPage.tsx
          for f in src/installations/InstallationBuilder.model.ts src/installations/InstallationBuilder.tsx src/installations/InstallationBuilder.spec.ts src/pages/SystemOwnerInstallationsPage.tsx; do
            echo "===== BEGIN frontend/$f ====="
            cat "$f"
            echo "===== END frontend/$f ====="
          done
