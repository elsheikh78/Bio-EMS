name: Temporary PR276 formatter diff
on:
  push:
    branches:
      - feat/licensing-entitlements-closure
jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Print Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npx prettier --write src/pages/SystemOwnerCommercialOperationsPage.tsx
          cd ..
          git diff -- frontend/src/pages/SystemOwnerCommercialOperationsPage.tsx
