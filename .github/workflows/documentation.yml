name: Documentation integrity

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'tools/project-audit/**'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.txt'
      - 'docs/**'
      - 'tools/project-audit/**'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/project-audit -p 'test_*.py' -v
      - run: python tools/project-audit/check_docs.py
